plugins { id 'com.android.application' }

android {
    namespace 'io.xiyan.agent.runtimeprobe'
    compileSdk 35
    defaultConfig {
        applicationId 'io.xiyan.agent.runtimeprobe'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-probe'
        ndk { abiFilters 'x86_64', 'arm64-v8a' }
        buildConfigField 'String', 'SOURCE_COMMIT', groovy.json.JsonOutput.toJson(rootProject.xiyanGitState.sourceCommit)
        buildConfigField 'boolean', 'SOURCE_TREE_CLEAN', rootProject.xiyanGitState.sourceTreeClean.toString()
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libcodex_app_server.so']
        }
    }
    lint { abortOnError true; warningsAsErrors true }
}

tasks.configureEach { task ->
    if (task.name.startsWith('generate') && task.name.endsWith('BuildConfig')) {
        task.doFirst { rootProject.assertXiyanGitState() }
    }
}
