name: Android P0 checks

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**']
    tags: ['v0.*-p0*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 35 build dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tests, lint, and APK
        env:
          XIYAN_SOURCE_COMMIT: ${{ github.sha }}
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Verify and package P0 debug build
        env:
          XIYAN_SOURCE_COMMIT: ${{ github.sha }}
        run: tools/package-p0.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xiyan-p0-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ github.sha }}
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
          if-no-files-found: warn

  prerelease:
    if: startsWith(github.ref, 'refs/tags/v0.') && contains(github.ref, '-p0') && github.repository == 'XiYanzx/xiyan-agent'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xiyan-p0-${{ github.sha }}
          path: artifacts/
      - name: Check verified build assets
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish technical preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --prerelease --title "Xiyan Agent P0 技术验证" --notes-file docs/P0-release-notes.zh-CN.md
